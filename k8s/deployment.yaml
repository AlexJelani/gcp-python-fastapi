apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-python-fastapi
  namespace: default
  labels:
    app: gcp-python-fastapi
spec:
  # Single replica: the cluster runs one small e2-small node whose CPU is
  # largely consumed by system + ingress pods. One replica fits cleanly; scale
  # up once the node pool has more capacity.
  replicas: 1
  selector:
    matchLabels:
      app: gcp-python-fastapi
  template:
    metadata:
      labels:
        app: gcp-python-fastapi
    spec:
      containers:
        - name: gcp-python-fastapi
          image: gcr.io/PROJECT_ID/my-app:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Readiness probes a dedicated endpoint so a not-ready instance is
          # held out of rotation without being restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness only restarts on a truly dead process.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
