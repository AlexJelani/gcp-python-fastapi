steps:
  # Step 1: Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/my-app:latest", "."]

  # Step 2: Push Docker Image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/my-app:latest"]

  # Step 3: Run Unit Tests
  - name: "python:3.12"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -r requirements.txt
        pytest tests/

  # Step 4: Scan Docker Image with Trivy
  - name: "aquasec/trivy"
    args: ["image", "--exit-code", "0", "gcr.io/$PROJECT_ID/my-app:latest"]

  # Step 5: Snyk Code and Dependency Scanning
  - name: "node"
    entrypoint: "bash"
    secretEnv: ["SNYK_TOKEN"]
    args:
      - "-c"
      - |
        npm install -g snyk
        snyk auth $$SNYK_TOKEN
        snyk test || true
        snyk code test || true

  # Step 6: Deploy to GKE
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud container clusters get-credentials dsb-gke-cluster \
          --region us-central1 \
          --project $PROJECT_ID

        # Install Nginx Ingress Controller if not already installed
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml

        # Wait for Nginx Ingress Controller to be ready
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s

        # Patch image in deployment manifest
        sed -i "s|gcr.io/PROJECT_ID/my-app:latest|gcr.io/$PROJECT_ID/my-app:latest|g" k8s/deployment.yaml

        # Apply manifests
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        # PodMonitoring for Google Managed Prometheus (ignored if the CRD/
        # managed collection is not enabled on the cluster).
        kubectl apply -f k8s/podmonitoring.yaml || echo "PodMonitoring CRD not present; skipping"

        kubectl rollout status deployment/gcp-python-fastapi --timeout=120s

        # Print the Ingress external IP
        echo "Waiting for Ingress IP..."
        for i in $(seq 1 12); do
          IP=$(kubectl get ingress gcp-python-fastapi -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$IP" ]; then
            echo "App is available at: http://$IP"
            break
          fi
          echo "Still waiting... ($i/12)"
          sleep 10
        done

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
artifacts:
  objects:
    location: "gs://$PROJECT_ID-cb-builds"
    paths: ["*/**"]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudbuild-snyk-token/versions/latest
      env: "SNYK_TOKEN"
